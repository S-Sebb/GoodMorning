name: Holiday data

# Rebuilds the bundled public holidays from the newest python-holidays release. When the data
# changes, it opens or updates one pull request; merging and deploying stay with the owner.
on:
  schedule:
    - cron: '23 4 * * 1'  # Mondays, 04:23 UTC
  workflow_dispatch:
  push:
    branches: [t3/holiday-data-refresh-test]  # TEST ONLY

permissions: {}

concurrency:
  group: holiday-data

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # push the refresh branch
      pull-requests: write  # open or update its pull request
      actions: write  # approve Validate on the pull request
    env:
      BRANCH: holiday-data-refresh
      DATA: src/goodmorning/calendar/public_holidays.json
      GH_TOKEN: ${{ github.token }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
      - name: Rebuild from the newest python-holidays
        run: |
          uv run --no-project --with holidays python src/goodmorning/calendar/public_holidays_build.py > "$RUNNER_TEMP/changes.md"
          cat "$RUNNER_TEMP/changes.md"
      - name: Open or update the pull request
        run: |
          if git diff --quiet; then exit 0; fi
          if git fetch -q origin "$BRANCH" && git diff --quiet FETCH_HEAD -- "$DATA"; then
            echo 'The refresh branch already has this data.'
            exit 0
          fi
          title="Refresh public holidays from $(jq -r .source "$DATA")"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          git commit -qm "$title" -- "$DATA"
          git push -f origin "$BRANCH"
          {
            echo '## What and why'
            echo
            echo "The weekly Holiday data run rebuilt the bundled public holidays. Compared with main:"
            echo
            cat "$RUNNER_TEMP/changes.md"
            echo
            echo "China gets a year only once the State Council's schedule reaches python-holidays, and that year brings its make-up workdays (调休上班) too. Please check China's dates against the announcement."
            echo
            echo 'Holiday names that need Chinese wording are listed above. A coding agent adds them as `AGENTS.md` says; until then the name test fails.'
            echo
            echo '## Validation'
            echo
            echo 'This run approved Validate on this pull request; its `contracts` result shows below.'
            echo
            echo '## Risks'
            echo
            echo "Nothing is merged or deployed automatically. @$OWNER"
          } > "$RUNNER_TEMP/body.md"
          number=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh pr edit "$number" --title "$title" --body-file "$RUNNER_TEMP/body.md"
            gh pr comment "$number" --body "@$OWNER The holiday data changed again; the description lists every change compared with main."
          else
            gh pr create --base main --head "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          fi
          # Validate starts on its own but waits for approval, as for every pull request this token makes.
          sha=$(git rev-parse HEAD)
          for _ in $(seq 30); do
            run=$(gh run list --workflow validate.yml --commit "$sha" --event pull_request --json databaseId,conclusion --jq '.[0] // empty')
            if [ -n "$run" ]; then break; fi
            sleep 10
          done
          if [ "$(jq -r .conclusion <<< "$run")" = action_required ]; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$(jq -r .databaseId <<< "$run")/approve"
          fi
