name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.12', '3.14']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GM_TEST_TMPDIR: ${{ runner.temp }}/goodmorning-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - run: python -m unittest discover -s tests -p 'test_*.py' -q
      - run: node --test tests/test_projects.mjs
      - run: python tests/benchmark_initialization.py
      - run: node tests/benchmark_projects.mjs
      - run: python scripts/package_release.py --output dist/GoodMorning-deploy.zip
      - uses: actions/upload-artifact@v4
        with:
          name: GoodMorning-python-${{ matrix.python }}
          path: dist/GoodMorning-deploy.zip*
