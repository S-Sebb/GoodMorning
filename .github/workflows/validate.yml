name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.12', '3.14']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - run: python -m pip install -r requirements/browser.txt
      - run: python -m unittest discover -s tests -p 'test_*.py' -q
        env:
          GM_TEST_TMPDIR: ${{ runner.temp }}/goodmorning-tests
      - run: node --test tests/test_projects.mjs
