name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      # The same suite as the documented command, one process per module across the runner's
      # cores; only failing modules print their output.
      - run: |
          ls tests/test_*.py | xargs -P "$(nproc)" -n 1 sh -c '
            out=$(uv run -q --no-project --with-requirements requirements/browser.txt python -m unittest discover -s tests -p "${1##*/}" 2>&1) ||
              { printf "%s\n" "$out"; exit 1; }' _
        env:
          GM_TEST_TMPDIR: ${{ runner.temp }}/goodmorning-tests
      - run: node --test tests/test_parked_reasoning.mjs
