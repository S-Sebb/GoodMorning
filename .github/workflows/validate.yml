name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      # The same suite as the documented command, split into twice as many module groups as the
      # runner has cores; only failing groups print their output. A process per module repeats
      # the shared imports often enough to cost more than it saves.
      - working-directory: tests
        run: |
          ls test_*.py | sed 's/\.py$//' | awk -v n="$(( 2 * $(nproc) ))" '{ g[NR % n] = g[NR % n] " " $0 } END { for (i in g) print g[i] }' |
            xargs -P "$(nproc)" -L 1 sh -c '
              out=$(PYTHONPATH=. uv run -q --no-project --with-requirements ../requirements/browser.txt python -m unittest "$@" 2>&1) ||
                { printf "%s\n" "$out"; exit 1; }' _
        env:
          GM_TEST_TMPDIR: ${{ runner.temp }}/goodmorning-tests
      - run: node --test tests/test_parked_reasoning.mjs
