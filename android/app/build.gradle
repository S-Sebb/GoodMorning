plugins {
    id 'com.android.application'
}

// The release key and its password live outside the repository; see docs/android-app.md.
def keyDir = new File(System.getProperty('user.home'), '.local/share/goodmorning-android')

android {
    namespace 'me.love765.goodmorning'
    compileSdk 36

    defaultConfig {
        applicationId 'me.love765.goodmorning'
        minSdk 26
        targetSdk 36
        // Each release is tagged android-v<versionCode>; the app updates to higher codes. Codes 1 and 2
        // were the withdrawn 1.0 and 1.1, so phones that installed them still update to 0.1.
        versionCode 15
        versionName '0.13'
    }

    androidResources {
        localeFilters += ['en', 'zh-rCN']
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            storeFile new File(keyDir, 'release.keystore')
            keyAlias 'goodmorning'
            def password = new File(keyDir, 'keystore-password.txt')
            if (password.exists()) {
                storePassword password.text.trim()
                keyPassword password.text.trim()
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    // Android's org.json is a stub in local unit tests.
    testImplementation 'org.json:json:20260814'
}
