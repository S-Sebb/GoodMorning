# Only credential submissions consume this limit. Empty keys are not counted.
map "$request_method:$uri" $goodmorning_auth_key {
    default "";
    ~^POST:/api/auth/(login|password)$ $binary_remote_addr;
}
limit_req_zone $goodmorning_auth_key zone=goodmorning_auth_submit:1m rate=2r/s;

server {
    listen 80;
    server_name gm.love765.me;
    access_log off;
    error_log /dev/null crit;
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 308 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name gm.love765.me;
    ssl_certificate /etc/letsencrypt/live/goodmorning.love765.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/goodmorning.love765.me/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 50m;
    client_body_buffer_size 32k;
    client_body_timeout 15s;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    location / {
        limit_req zone=goodmorning_auth_submit burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://unix:/run/goodmorning/gateway.sock:;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Authorization "";
        proxy_read_timeout 30s;
    }
}
