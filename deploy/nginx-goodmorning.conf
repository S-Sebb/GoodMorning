# Only credential submissions consume this limit. Empty keys are not counted.
map "$request_method:$uri" $goodmorning_auth_key {
    default "";
    ~^POST:/api/auth/(login|password)$ $binary_remote_addr;
}
limit_req_zone $goodmorning_auth_key zone=goodmorning_auth_submit:1m rate=2r/s;

server {
    listen 80;
    server_name gm.love765.me;
    access_log off;
    error_log /dev/null crit;
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 308 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name gm.love765.me;
    ssl_certificate /etc/letsencrypt/live/goodmorning.love765.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/goodmorning.love765.me/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 50m;
    client_body_buffer_size 32k;
    client_body_timeout 15s;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    # Deployment pause fallback: when the gateway is stopped or returns
    # 502/503/504, show the cute bilingual maintenance page. The HTML itself
    # is internal (only for errors); its CSS/image assets are served directly
    # so they still load while the gateway socket is down. Files come from the
    # current release; the deploy helper must keep these locations on update.
    error_page 502 503 504 /maintenance.html;
    location = /maintenance.html {
        internal;
        root /opt/goodmorning/current/assets/web;
        add_header Cache-Control "no-store" always;
        add_header Retry-After 60 always;
    }
    location = /maintenance.css {
        root /opt/goodmorning/current/assets/web;
        add_header Cache-Control "public, no-cache" always;
    }
    location = /desk-secretary.png {
        root /opt/goodmorning/current/assets/web;
        add_header Cache-Control "public, no-cache" always;
    }
    location = /icons/gm.svg {
        root /opt/goodmorning/current/assets/web;
        add_header Cache-Control "public, no-cache" always;
    }
    location / {
        limit_req zone=goodmorning_auth_submit burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://unix:/run/goodmorning/gateway.sock:;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Authorization "";
        proxy_read_timeout 30s;
    }
}
